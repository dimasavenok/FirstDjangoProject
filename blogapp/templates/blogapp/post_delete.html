{% extends "catalog/base.html" %}
{% block content %}
<h1>Удалить пост "{{ object.title }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blogapp:post_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
